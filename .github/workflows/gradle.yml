name: HeXie CI / Nightly Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Same-repository PRs are already built by their push event. Keep the PR
    # trigger for fork PRs, where the upstream repository does not receive a push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: make gradle wrapper executable
      run: chmod +x ./gradlew
    - name: Build and package JAR
      run: ./gradlew build jar

    - name: Upload nightly JAR
      id: upload-jar
      uses: actions/upload-artifact@v7
      with:
        name: nightly-${{ github.sha }}
        path: |
          build/libs/*-NeoForge-*.jar
          !build/libs/*-sources.jar
        if-no-files-found: error
        retention-days: 30

    - name: Add download link to workflow summary
      run: echo "Download the JAR from [this artifact](${{ steps.upload-jar.outputs.artifact-url }})." >> "$GITHUB_STEP_SUMMARY"
