plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
def artifactBuildDate = new Date().format('yyMMdd', TimeZone.getTimeZone('Asia/Shanghai'))
def artifactLoaderName = 'NeoForge'
def artifactArchiveVersion = "${project.version}-${artifactBuildDate}"
base.archivesName = "Hexie-${minecraft_version}-${artifactLoaderName}"

tasks.withType(Jar).configureEach {
    archiveVersion = artifactArchiveVersion
    if (name != 'fontsJar') {
        from(project.files('LICENSE.txt', 'THIRD_PARTY_NOTICES.txt')) { into 'META-INF' }
        from('art_assets') {
            include 'LICENSE.txt', 'README.md'
            into 'META-INF/licenses/hexie-art'
        }
    }
}

// Keep resource IDs unchanged: Minecraft merges the two mods' resource trees.
// Sources stay in the development resource roots so IDE runs still load fonts.
def fontResourcePatterns = [
        'assets/hexie/sign_fonts/**',
        'META-INF/licenses/sign-fonts/**',
        'META-INF/licenses/tex-gyre/**'
]
def fontsJar = tasks.register('fontsJar', Jar) {
    archiveBaseName = "Hexie-Fonts-${minecraft_version}-${artifactLoaderName}"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('src/main/resources') { include fontResourcePatterns }
    from('src/generated/resources') { include fontResourcePatterns }
    from('src/fonts/resources') {
        filesMatching('META-INF/neoforge.mods.toml') {
            expand mod_version: project.version, minecraft_version: minecraft_version
        }
    }
    inputs.property('mod_version', project.version)
    inputs.property('minecraft_version', minecraft_version)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('jar', Jar) {
    exclude fontResourcePatterns
    dependsOn fontsJar
}


// Publish this archive alongside each release so editable artwork is available.
def artSourcesZip = tasks.register('artSourcesZip', Zip) {
    archiveBaseName = base.archivesName
    archiveVersion = artifactArchiveVersion
    archiveClassifier = 'art-sources'
    destinationDirectory = layout.buildDirectory.dir('sources')
    from('art_assets') { into 'art_assets' }
    from(project.files('LICENSE.txt', 'THIRD_PARTY_NOTICES.txt'))
    from('src/main/resources/META-INF/licenses') {
        exclude 'sign-fonts/**', 'tex-gyre/**'
        into 'META-INF/licenses'
    }
}

tasks.named('assemble') {
    dependsOn artSourcesZip, fontsJar
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named('sourcesJar', Jar) {
    destinationDirectory = layout.buildDirectory.dir('sources')
    from('src/fonts/resources/META-INF/THIRD_PARTY_NOTICES.txt') {
        into 'META-INF/licenses/sign-fonts'
    }
}

// A clean download directory containing only this build's two installable mods.
def releasePackages = tasks.register('releasePackages', Sync) {
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from(fontsJar.flatMap { it.archiveFile })
    into layout.buildDirectory.dir('release')
}

tasks.named('assemble') {
    dependsOn releasePackages
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**', '**/*.bbmodel'
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.crystaelix.com/releases' }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content {
            includeGroup 'dev.ryanhcode.sable-companion'
            includeGroup 'dev.simulated_team.simulated'
        }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    // RailX publishes JARs on GitHub Releases rather than a Maven repository.
    ivy {
        name = 'RailXReleases'
        url = 'https://github.com/lhwdev/railx/releases/download'
        patternLayout { artifact "mc${minecraft_version}-[revision]/[artifact]-[revision].[ext]" }
        metadataSources { artifact() }
        content { includeModule 'com.lhwdev.minecraft.railx', 'railx' }
    }

    mavenCentral()
}

sourceSets {
    aeronautics {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    aeronauticsRailx {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += sourceSets.aeronautics.runtimeClasspath
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir("run-1.21.1/${name}").asFile
            systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('tmp').get().asFile.absolutePath
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.DEBUG

            // Keep the existing aviation stack on non-client runs and the aviation client.
            if (name != 'client') {
                sourceSet = sourceSets.aeronautics
            }
        }
        client {
            client()
            sourceSet = sourceSets.main
            ideName = 'Client - Create'
            gameDirectory = layout.projectDirectory.dir('run-1.21.1/client-create').asFile
        }
        clientAeronautics {
            client()
            sourceSet = sourceSets.aeronautics
            ideName = 'Client - Create + Aeronautics'
            gameDirectory = layout.projectDirectory.dir('run-1.21.1/client').asFile
        }
        clientAeronauticsRailx {
            client()
            sourceSet = sourceSets.aeronauticsRailx
            ideName = 'Client - Create + Aeronautics + RailX'
            // Share the aviation environment, including every locally installed mod.
            gameDirectory = layout.projectDirectory.dir('run-1.21.1/client').asFile
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer { type = 'gameTestServer' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--existing-mod', 'create',
                    '--output', file(providers.gradleProperty('hexieDataOutput')
                            .getOrElse('build/generated/datagen')).absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', file('src/generated/resources').absolutePath
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    // Optional integration API; Simurail is not bundled into the published jar.
    compileOnly("com.crystaelix:simurail:${simurail_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }
    compileOnly("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:1.3.2") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:1.6.0") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:1.116.1") { transitive = false }
    compileOnly("com.lhwdev.minecraft.railx:railx:${railx_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
    compileOnly("maven.modrinth:sodium:${sodium_api_version}") { transitive = false }

    // Aviation mods are selected per run.
    aeronauticsRuntimeOnly "com.crystaelix:simurail:${simurail_version}"
    aeronauticsRuntimeOnly "maven.modrinth:create-aeronautics:${aeronautics_version}"
    aeronauticsRuntimeOnly "maven.modrinth:sable:${sable_version}"
    aeronauticsRailxRuntimeOnly "com.lhwdev.minecraft.railx:railx:${railx_version}"
    aeronauticsRailxRuntimeOnly "thedarkcolour:kotlinforforge-neoforge:${railx_kotlinforforge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [mod_version: mod_version, mod_name: mod_name,
                      minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll '-Xmaxerrs', '10000'
}

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'FairingStudio',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'FairingStudio'
    ])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
