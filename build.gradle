plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
def artifactBuildDate = new Date().format('yyMMdd', TimeZone.getTimeZone('Asia/Shanghai'))
def artifactLoaderName = 'NeoForge'
def artifactArchiveVersion = "${project.version}-${artifactBuildDate}"
base.archivesName = "Hexie-${minecraft_version}-${artifactLoaderName}"

tasks.withType(Jar).configureEach {
    archiveVersion = artifactArchiveVersion
    if (name != 'fontsJar') {
        from(project.files('LICENSE.txt', 'THIRD_PARTY_NOTICES.txt')) { into 'META-INF' }
        from('art_assets') {
            include 'LICENSE.txt', 'README.md'
            into 'META-INF/licenses/hexie-art'
        }
    }
}

// Keep resource IDs unchanged: Minecraft merges the two mods' resource trees.
// Sources stay in the development resource roots so IDE runs still load fonts.
def fontResourcePatterns = [
        'assets/hexie/sign_fonts/**',
        'META-INF/licenses/sign-fonts/**',
        'META-INF/licenses/tex-gyre/**'
]
def fontsJar = tasks.register('fontsJar', Jar) {
    archiveBaseName = "Hexie-Fonts-${minecraft_version}-${artifactLoaderName}"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('src/main/resources') { include fontResourcePatterns }
    from('src/generated/resources') { include fontResourcePatterns }
    from('src/fonts/resources') {
        filesMatching('META-INF/neoforge.mods.toml') {
            expand mod_version: project.version, minecraft_version: minecraft_version
        }
    }
    inputs.property('mod_version', project.version)
    inputs.property('minecraft_version', minecraft_version)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('jar', Jar) {
    exclude fontResourcePatterns
    dependsOn fontsJar
}


// Publish this archive alongside each release so editable artwork is available.
def artSourcesZip = tasks.register('artSourcesZip', Zip) {
    archiveBaseName = base.archivesName
    archiveVersion = artifactArchiveVersion
    archiveClassifier = 'art-sources'
    destinationDirectory = layout.buildDirectory.dir('sources')
    from('art_assets') { into 'art_assets' }
    from(project.files('LICENSE.txt', 'THIRD_PARTY_NOTICES.txt'))
    from('src/main/resources/META-INF/licenses') {
        exclude 'sign-fonts/**', 'tex-gyre/**'
        into 'META-INF/licenses'
    }
}

tasks.named('assemble') {
    dependsOn artSourcesZip, fontsJar
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named('sourcesJar', Jar) {
    destinationDirectory = layout.buildDirectory.dir('sources')
    from('src/fonts/resources/META-INF/THIRD_PARTY_NOTICES.txt') {
        into 'META-INF/licenses/sign-fonts'
    }
}

// A clean download directory containing only this build's two installable mods.
def releasePackages = tasks.register('releasePackages', Sync) {
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from(fontsJar.flatMap { it.archiveFile })
    into layout.buildDirectory.dir('release')
}

tasks.named('assemble') {
    dependsOn releasePackages
}

// Built-in rolling-stock packs (each owning its own vehicle + bogey java/ and resources/ roots).
// Registry IDs and asset paths remain under namespace 'hexie' for full save compatibility.
def builtinPacks = ['crh1a', 'crh2a', 'cr200j', 'series25', 'ss7d', 'df11g', 'hxd3d', 'qj']

sourceSets.main.java {
    srcDir 'renderer/java'
    builtinPacks.each { pack -> srcDir "packs/${pack}/java" }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'renderer/resources'
    builtinPacks.each { pack -> srcDir "packs/${pack}/resources" }
    exclude '**/.cache/**', '**/*.bbmodel'
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.crystaelix.com/releases' }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content {
            includeGroup 'dev.ryanhcode.sable-companion'
            includeGroup 'dev.simulated_team.simulated'
        }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    // RailX publishes JARs on GitHub Releases rather than a Maven repository.
    ivy {
        name = 'RailXReleases'
        url = 'https://github.com/lhwdev/railx/releases/download'
        patternLayout { artifact "mc${minecraft_version}-[revision]/[artifact]-[revision].[ext]" }
        metadataSources { artifact() }
        content { includeModule 'com.lhwdev.minecraft.railx', 'railx' }
    }

    mavenCentral()
}

sourceSets {
    client {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    aeronautics {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    clientAeronautics {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += sourceSets.aeronautics.runtimeClasspath
    }
    aeronauticsRailx {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += sourceSets.clientAeronautics.runtimeClasspath
    }
}

neoForge {
    version = neo_version
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir("run-1.21.1/${name}").asFile
            systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('tmp').get().asFile.absolutePath
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.DEBUG

            // Keep the existing aviation stack on non-client runs and the aviation client.
            if (name != 'client') {
                sourceSet = sourceSets.aeronautics
            }
        }
        client {
            client()
            sourceSet = sourceSets.client
            ideName = 'Client - Create'
            gameDirectory = layout.projectDirectory.dir('run-1.21.1/client-create').asFile
        }
        clientAeronautics {
            client()
            sourceSet = sourceSets.clientAeronautics
            ideName = 'Client - Create + Aeronautics'
            gameDirectory = layout.projectDirectory.dir('run-1.21.1/client').asFile
        }
        clientAeronauticsRailx {
            client()
            sourceSet = sourceSets.aeronauticsRailx
            ideName = 'Client - Create + Aeronautics + RailX'
            // Share the aviation environment, including every locally installed mod.
            gameDirectory = layout.projectDirectory.dir('run-1.21.1/client').asFile
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer { type = 'gameTestServer' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--existing-mod', 'create',
                    '--output', file(providers.gradleProperty('hexieDataOutput')
                            .getOrElse('build/generated/datagen')).absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', file('src/generated/resources').absolutePath
            builtinPacks.each { pack ->
                programArguments.addAll '--existing', file("packs/${pack}/resources").absolutePath
            }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    // Optional integration API; Simurail is not bundled into the published jar.
    compileOnly("com.crystaelix:simurail:${simurail_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }
    compileOnly("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:1.3.2") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:1.6.0") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:1.116.1") { transitive = false }
    compileOnly("com.lhwdev.minecraft.railx:railx:${railx_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
    compileOnly("maven.modrinth:sodium:${sodium_api_version}") { transitive = false }
    // Sodium 0.8.13 wraps its mod classes inside META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.13+mc1.21.1-mod.jar
    def sodium08Outer = configurations.detachedConfiguration(dependencies.create("maven.modrinth:sodium:uMOpc5uV"))
    sodium08Outer.transitive = false
    def sodium08Inner = layout.buildDirectory.file('extracted-deps/sodium-neoforge-0.8.13+mc1.21.1-mod.jar').get().asFile
    if (!sodium08Inner.isFile()) {
        sodium08Inner.parentFile.mkdirs()
        def outerJar = sodium08Outer.singleFile
        def zip = new java.util.zip.ZipFile(outerJar)
        try {
            def entry = zip.getEntry('META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.13+mc1.21.1-mod.jar')
            if (entry != null) {
                zip.getInputStream(entry).withCloseable { ins ->
                    sodium08Inner.withOutputStream { outs -> outs << ins }
                }
            }
        } finally {
            zip.close()
        }
    }
    compileOnly files(sodium08Inner)
    def cee = "maven.modrinth:create-electro-energetics:ZMfRgLy5"
    compileOnly(cee) { transitive = false }
    if (providers.gradleProperty('withCee').isPresent()) {
        runtimeOnly(cee) { transitive = false }
    }

    // Client-only development mods; the aviation and RailX clients inherit their base stacks.
    // Sodium 0.8.13 is staged into run mods/ below (placing jar-in-jar Sodium on clientRuntimeClasspath causes JarSelector to drop its nested mod jar).
    clientRuntimeOnly "maven.modrinth:patchouli:${patchouli_version}"
    clientAeronauticsRuntimeOnly "maven.modrinth:patchouli:${patchouli_version}"

    // Aviation mods are selected per run.
    aeronauticsRuntimeOnly "com.crystaelix:simurail:${simurail_version}"
    aeronauticsRuntimeOnly "maven.modrinth:create-aeronautics:${aeronautics_version}"
    aeronauticsRuntimeOnly "maven.modrinth:sable:${sable_version}"
    aeronauticsRuntimeOnly("maven.modrinth:copycats:${copycats_version}") { transitive = false }
    aeronauticsRailxRuntimeOnly "com.lhwdev.minecraft.railx:railx:${railx_version}"
    aeronauticsRailxRuntimeOnly "thedarkcolour:kotlinforforge-neoforge:${railx_kotlinforforge_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def sodium08Runtime = configurations.detachedConfiguration(dependencies.create("maven.modrinth:sodium:uMOpc5uV"))
sodium08Runtime.transitive = false
def stageClientCreateSodium = tasks.register('stageClientCreateSodium', Copy) {
    from(sodium08Runtime) { rename { 'sodium-neoforge-0.8.13+mc1.21.1.jar' } }
    into layout.projectDirectory.dir('run-1.21.1/client-create/mods')
}
def stageClientAeronauticsSodium = tasks.register('stageClientAeronauticsSodium', Copy) {
    from(sodium08Runtime) { rename { 'sodium-neoforge-0.8.13+mc1.21.1.jar' } }
    into layout.projectDirectory.dir('run-1.21.1/client/mods')
}
tasks.matching { it.name == 'prepareClientRun' }.configureEach { dependsOn stageClientCreateSodium }
tasks.matching { it.name == 'prepareClientAeronauticsRun' || it.name == 'prepareClientAeronauticsRailxRun' }
        .configureEach { dependsOn stageClientAeronauticsSodium }

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [mod_version: mod_version, mod_name: mod_name,
                      minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll '-Xmaxerrs', '10000'
    def zonesProp = providers.gradleProperty('compileOnlyZones').orNull
    if (zonesProp != null && !zonesProp.trim().isEmpty()) {
        def allowedZones = zonesProp.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
        include(allowedZones.collect { z -> z == 'entry' ? 'willow/train/hexie/Main.java' : "willow/train/hexie/${z}/**/*.java" })
    }
}

// Common CEE mixins are applied on dedicated servers, where rendering classes are absent.
def verifyCeeMixinSides = tasks.register('verifyCeeMixinSides') {
    group = 'verification'
    description = 'Checks that CEE common mixins do not link client-only rendering classes.'
    dependsOn tasks.named('compileJava')
    def configFile = layout.projectDirectory.file('src/generated/resources/hexie.mixins.json')
    inputs.file(configFile)
    inputs.files(tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory })
    doLast {
        def config = new groovy.json.JsonSlurper().parse(configFile.asFile)
        def common = config.mixins.findAll { it.startsWith('cee.') }
        def client = config.client.findAll { it.startsWith('client.cee.') }
        if (!common.contains('cee.PantographMovementMixin')
                || !client.contains('client.cee.PantographMovementRendererMixin')
                || common.contains('client.cee.PantographMovementRendererMixin')) {
            throw new GradleException('CEE pantograph movement and rendering mixins must remain on their respective sides')
        }
        def classes = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile
        def names = common.collect { 'willow/train/hexie/compat/mixins/' + it.replace('.', '/') }
        names.add('willow/train/hexie/compat/cee/PantographMounting')
        def clientOnly = ['net/minecraft/client/', 'com/mojang/blaze3d/',
                          'com/simibubi/create/content/contraptions/render/',
                          'com/simibubi/create/foundation/virtualWorld/']
        names.each { name ->
            def bytecode = new File(classes, name + '.class')
            if (!bytecode.isFile()) throw new GradleException("Missing CEE compatibility class: ${name}")
            def contents = new String(bytecode.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            def forbidden = clientOnly.find { contents.contains(it) }
            if (forbidden != null)
                throw new GradleException("Dedicated-server CEE class ${name} references client-only ${forbidden}")
        }
    }
}
tasks.named('check') { dependsOn verifyCeeMixinSides }
tasks.named('jar') { dependsOn verifyCeeMixinSides }

apply from: 'gradle/domain-boundaries.gradle'

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'FairingStudio',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'FairingStudio'
    ])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
