plugins {
    id 'java'
}

group = mod_group_id
version = "${mod_version}+mc${minecraft_version}"
base { archivesName = mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

// Offline build: classpath points at the local PCL instance.
// No network repositories are used, see BUILD-NOTES.md.
ext {
    mcDir    = "H:/柳树服beta2/.minecraft"
    instName = "Willow11TH_Aero_beta2(无地图)"
    instDir  = "${mcDir}/versions/${instName}"
    modsDir  = "${instDir}/mods"
}

repositories {
    // intentionally empty
}

dependencies {
    // Minecraft libs + NeoForge 21.1.248
    compileOnly fileTree(dir: "${mcDir}/libraries", include: ['**/*.jar'])
    // patched client jar
    compileOnly files("${instDir}/${instName}.jar")
    // jarJar deps extracted from Create (Flywheel / Ponder / Registrate)
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // target mods
    compileOnly fileTree(dir: modsDir, include: [
        '*create-1.21.1*.jar',
        'sable-neoforge-*.jar',
        'simurail-*.jar',
        'create-aeronautics-bundled-*.jar',
        'electroenergetics-*.jar',
        'powergrid-*.jar'
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version
        ])
    }
}

// ---- 发布：按固定命名规则复制到「历史版本」目录 ----
def releaseDirName = "\u5386\u53F2\u7248\u672C"
def releaseFileName = "[\u548C\u8C10\uFF1A\u6A21\u62DF\u81EA\u52A8\u94C1\u8DEF]Hexie_AutoSimulateTrain${mod_version}.jar"

tasks.register('releaseJar', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir(releaseDirName)
    rename { releaseFileName }
}

tasks.named('build') {
    finalizedBy tasks.named('releaseJar')
}
