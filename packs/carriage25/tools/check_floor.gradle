// gradlew -I packs/carriage25/tools/check_floor.gradle checkCarriage25Floor
allprojects { project ->
    afterEvaluate {
        def compiledChecks = layout.buildDirectory.dir('carriage25-check/classes')
        def compileCheck = tasks.register('compileCarriage25FloorCheck', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('packs/carriage25/tools/Carriage25FloorCheck.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = compiledChecks
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
            options.encoding = 'UTF-8'
        }
        tasks.register('checkCarriage25Floor', JavaExec) {
            dependsOn compileCheck
            classpath = sourceSets.main.runtimeClasspath + files(compiledChecks)
            mainClass = 'Carriage25FloorCheck'
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        }
    }
}
